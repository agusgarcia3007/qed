[package]
name = "qed"
version = "0.1.1"
edition = "2021"
description = "Minimal, fast coding harness over the official Claude Code CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/agusgarcia3007/qed"

[dependencies]
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
